[project]
name = "home-view-graph"
version = "0.1.0"
description = "Home-view-graph: a knowledge graph over a directory you choose, built to prove itself wrong"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []          # stdlib only, on purpose -- see DECISIONS.md §5
keywords = ["knowledge-graph", "sqlite", "fts5", "personal-search", "mcp",
            "ollama", "embeddings", "semantic-search", "vector-search",
            "hybrid-search", "local-first", "offline-first"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Utilities",
  "Environment :: Console",
]

[project.scripts]
homegraph = "homegraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homegraph*"]

[tool.setuptools.package-data]
homegraph = ["rules/*.toml"]

[tool.mypy]
python_version = "3.12"
# Baseline for the whole package: catch real type errors, do not demand an
# annotation on every helper. This already passes with zero findings, which is
# the useful fact -- there are no type bugs here, only unannotated code.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# Strict where a wrong type would be silent AND load-bearing. Each of these
# carries a value that everything downstream trusts without re-deriving:
#
#   corpus       the category label -- one function decides the partition
#   store        node ids used as edge endpoints; lastrowid is int|None and
#                passing the None on surfaced far away as a foreign-key error
#   temporal     an int that means a set of dates; the bit convention is a
#                contract M5 depends on
#   search       fused hits, where the wrong key halves a rank invisibly
#   incremental  the changed/touched distinction that decides re-extraction
#   lock         a pid and a boot-relative start time decide whether another
#                writer is alive; either one arriving as a str compares
#                unequal forever and the barrier silently stops refusing
#
# Deliberately NOT strict: models/, mesh.py, cli.py, visualize.py, tests/. Their errors are
# loud -- an extractor that mishandles a type raises, and a checkpoint goes red.
# Annotating them would document `str -> str` several hundred times and find
# nothing, which is measured rather than assumed: plain mypy is already clean.
[[tool.mypy.overrides]]
module = [
  "homegraph.corpus",
  "homegraph.store",
  "homegraph.temporal",
  "homegraph.search",
  "homegraph.incremental",
  "homegraph.lock",
  "homegraph.config",
]
# `strict = true` is a global flag; in a per-module section mypy applies it to
# everything, which is how this first came back with 231 errors in the files it
# was supposed to exempt. Expanded into the flags it stands for, which ARE
# per-module.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# Pyright is here as a second opinion on the modules mypy deliberately does not
# press, and it disagreed on the first run. Measured 2026-07-26 with pyright
# 1.1.411 against an unchanged tree:
#
#   uvx mypy homegraph/   Success: no issues found in 34 source files
#   pyright homegraph/    14 errors, 0 warnings
#
# The 14 land almost entirely in the files the mypy comment above exempts:
# cli.py (5), update.py (5), models/m1_extractors.py (2), mcp_server.py (1),
# models/m2_build.py (1). That comment argues those errors would be loud -- "an
# extractor that mishandles a type raises, and a checkpoint goes red". That is a
# prediction, and these 14 are the part of it that had not been tested: mypy
# does not check bodies of untyped functions, so it was not looking. Both tools
# stay. mypy owns the strict contract on the seven load-bearing modules; pyright
# covers the rest, where nothing was checking types at all.
#
# Same pinning discipline as [tool.ruff.lint] below, for the same reason.
# `typeCheckingMode` is written down rather than inherited: pyright's default has
# moved between releases, and a mode change would silently re-scope the gate
# while every reported number stayed green. The five rules are the ones that
# actually fire today, listed so a version bump cannot quietly downgrade one to a
# warning. Rules NOT listed keep whatever "standard" gives them -- that is a
# deliberate looser edge, not an oversight; tighten by naming a rule here.
[tool.pyright]
pythonVersion = "3.12"
include = ["homegraph"]
typeCheckingMode = "standard"
reportArgumentType = "error"
reportGeneralTypeIssues = "error"
reportAttributeAccessIssue = "error"
reportOptionalMemberAccess = "error"
reportCallIssue = "error"

[tool.ruff]
line-length = 88
target-version = "py312"

# Pinned, because inheriting a tool's default means the gate can change meaning
# without anyone editing the repository -- and it did. These four were ruff's
# default when `uvx ruff check .` was first recorded as clean; by ruff 0.16 the
# bare command reported 2 200 findings over an unchanged tree, 1 399 of them
# `UP031` objecting to the `%`-formatting this codebase uses throughout on
# purpose. Nothing had regressed. The command had.
#
# Same shape as the pytest file list in DECISIONS.md section 33: **the thing
# that decides what gets checked was implicit**, so it could drift while every
# reported number stayed green. Written down here, `uvx ruff check .` means the
# same next year as today.
#
# E501 (line length) is deliberately NOT selected. `line-length` above still
# governs any formatter run, but as a gate it would fail 49 lines that are
# mostly string literals in mutation needles, where wrapping makes the needle
# harder to read than the long line. If that trade is ever worth revisiting,
# add "E5" here and expect to touch those files.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test_cp*.py is a script first and a pytest module second. Without the
# adapters at the bottom of each file, pytest collected all seven and ran none.
#
# `test_no_real_paths.py` is listed explicitly rather than by widening the
# pattern to `test_*.py`: this narrow list is what stopped the samplers and
# scoring scripts under tests/gold/ from being collected as tests, and a
# pattern that silently starts collecting more files is how the "pytest ran
# nothing" failure happened in the first place. A new checkpoint has to be
# added here on purpose.
#
# The previous version of this comment ended "-- and if that is forgotten, it
# is visible as a test that never appears rather than as a test that quietly
# passes". It was forgotten twice: `test_i1.py` and `test_i2.py` were cited as
# green while `pytest tests/` never collected either. Visibility that depends
# on someone comparing two lists is not a mechanism, so the claim now has one:
# `test_suite_is_complete.py` fails if any `tests/test_*.py` is missing here.
python_files = ["test_cp*.py", "test_no_real_paths.py", "test_h1.py", "test_h2.py", "test_h3.py", "test_h3_graph.py", "test_h3_crosslingual.py", "test_i1.py", "test_i2.py", "test_i3.py", "test_i4.py", "test_suite_is_complete.py", "test_type_regressions.py", "test_review_findings.py"]
